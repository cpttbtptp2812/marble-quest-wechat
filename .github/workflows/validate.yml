name: Validate WeChat Mini Game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      # Keep the generated entry at repo root for direct WeChat DevTools import.
      # Rebase first so near-simultaneous pushes do not race each other.
      - name: Commit generated game.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if ! git diff --cached --quiet; then
            git commit -m "build: update generated WeChat game entry"
            git pull --rebase origin main
            git push
          else
            echo "game.js is already up to date"
          fi

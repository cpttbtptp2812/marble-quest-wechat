name: Validate native WeChat Mini Game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check game.js
      - run: node --check src/physics/matter.js
      - run: node scripts/smoke-test.js
      - run: node -e "const fs=require('fs'); for (const f of ['game.json','project.config.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('WeChat config JSON OK')"
